      <h1>维护层</h1>
<p><code>wiki/</code> 是由 agent 维护和持续更新的知识层。</p>
<ul>
<li><code>topics/</code> 按话题组织外部知识与应用分析，承接原 <code>knowledge/</code> 与 <code>bridges/</code>。</li>
<li><code>self/</code> 保存关于你稳定偏好与判断模式的结构化知识。</li>
<li><code>frameworks/</code> 保存高复用、低噪音的判断框架与 query 入口页。</li>
<li><code>site/</code> 保存从 Markdown 生成的静态网页视图。</li>
</ul>
<p>优先更新已有页面，而不是制造重复页面。新维护页默认写中文。</p>
